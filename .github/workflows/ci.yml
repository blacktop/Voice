name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Voice needs the macOS 27 SDK (SpeechAnalyzer, `anyAppleOS 27`), which the
    # macos-26 image does not carry. The xcode-27 preview image defaults to the
    # current Xcode 27 beta, so DEVELOPER_DIR is deliberately unset: the beta's
    # path changes with every seed, and only /Applications/Xcode.app is stable.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: brew install xcodegen just

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/VoiceMLXRuntime/Package.resolved', 'Voice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build and test
        run: just ci
